"""
A user in the system
"""
type User {
  """
  Unique identifier for the user
  """
  id: ID!
  
  """
  User's display name
  """
  name: String!
  
  """
  User's email address
  """
  email: String!
  
  """
  Posts created by this user
  """
  posts: [Post!]!
  
  """
  Date when the user was created
  """
  createdAt: String!
}

"""
A blog post
"""
type Post {
  """
  Unique identifier for the post
  """
  id: ID!
  
  """
  Post title
  """
  title: String!
  
  """
  Post content in Markdown format
  """
  content: String!
  
  """
  Author of the post
  """
  author: User!
  
  """
  Post publication status
  """
  published: Boolean!
  
  """
  Date when the post was created
  """
  createdAt: String!
  
  """
  Date when the post was last updated
  """
  updatedAt: String!
  
  """
  Tags associated with the post
  """
  tags: [String!]!
}

"""
Input for creating a new user
"""
input CreateUserInput {
  """
  User's display name
  """
  name: String!
  
  """
  User's email address
  """
  email: String!
}

"""
Input for creating a new post
"""
input CreatePostInput {
  """
  Post title
  """
  title: String!
  
  """
  Post content in Markdown format
  """
  content: String!
  
  """
  Author's user ID
  """
  authorId: ID!
  
  """
  Tags to associate with the post
  """
  tags: [String!]
}

"""
Input for updating an existing post
"""
input UpdatePostInput {
  """
  Post title
  """
  title: String
  
  """
  Post content in Markdown format
  """
  content: String
  
  """
  Post publication status
  """
  published: Boolean
  
  """
  Tags to associate with the post
  """
  tags: [String!]
}

"""
Root Query type
"""
type Query {
  """
  Get a user by ID
  """
  user(id: ID!): User
  
  """
  Get all users
  """
  users: [User!]!
  
  """
  Get a post by ID
  """
  post(id: ID!): Post
  
  """
  Get all posts
  """
  posts(
    """
    Filter by publication status
    """
    published: Boolean
    
    """
    Filter by tag
    """
    tag: String
  ): [Post!]!
}

"""
Root Mutation type
"""
type Mutation {
  """
  Create a new user
  """
  createUser(input: CreateUserInput!): User!
  
  """
  Create a new post
  """
  createPost(input: CreatePostInput!): Post!
  
  """
  Update an existing post
  """
  updatePost(id: ID!, input: UpdatePostInput!): Post!
  
  """
  Delete a post
  """
  deletePost(id: ID!): Boolean!
  
  """
  Publish a post
  """
  publishPost(id: ID!): Post!
}

"""
GraphQL schema definition
"""
schema {
  query: Query
  mutation: Mutation
}
