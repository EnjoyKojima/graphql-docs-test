spectaql:
  # Output directory for static site
  targetDir: ./docs/spectaql/public
  
introspection:
  schemaFile: ./schema.graphql
  
servers:
  - url: https://api.example.com/graphql
    description: Production API
    production: true
  - url: http://localhost:4000/graphql
    description: Development API
  
info:
  title: GraphQL API Documentation
  description: |
    This is a sample GraphQL API documentation generated using SpectaQL.
    
    ## Getting Started
    
    This API provides endpoints for managing users and posts.
    
    ## Authentication
    
    Some endpoints require authentication. Include your API key in the `Authorization` header:
    
    ```
    Authorization: Bearer YOUR_API_KEY
    ```
    
  contact:
    name: API Support
    email: support@example.com
    url: https://example.com/support
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 1.0.0
  
# Additional options
options:
  # Theme colors
  themeColor: '#0066cc'
  
  # Display options
  displayAllServers: true
  
# Example queries to demonstrate the API
examples:
  - title: Get User Example
    query: |
      query GetUser {
        user(id: "1") {
          id
          name
          email
          posts {
            id
            title
          }
        }
      }
  - title: Create User Example
    query: |
      mutation CreateUser {
        createUser(input: {
          email: "user@example.com"
          name: "John Doe"
          bio: "Software developer"
        }) {
          id
          name
          email
        }
      }
