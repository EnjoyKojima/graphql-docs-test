"""
Sample GraphQL Schema for POC
"""

type Query {
  """
  Get a user by ID
  """
  user(id: ID!): User

  """
  Get all users
  """
  users: [User!]!

  """
  Get a post by ID
  """
  post(id: ID!): Post
}

type Mutation {
  """
  Create a new user
  """
  createUser(input: CreateUserInput!): User!

  """
  Create a new post
  """
  createPost(input: CreatePostInput!): Post!
}

"""
User type representing a registered user
"""
type User {
  id: ID!
  name: String!
  email: String!
  posts: [Post!]!
  createdAt: String!
}

"""
Post type representing a blog post
"""
type Post {
  id: ID!
  title: String!
  content: String!
  author: User!
  createdAt: String!
}

input CreateUserInput {
  name: String!
  email: String!
}

input CreatePostInput {
  title: String!
  content: String!
  authorId: ID!
}
